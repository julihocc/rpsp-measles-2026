[project]
name = "rpsp-measles-2026"
version = "1.0.0"
description = "Code and data to reproduce the analysis of the 2025-2026 measles resurgence in Canada, Mexico and the United States"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.10"
dependencies = [
    "jinja2==3.1.6",
    "matplotlib==3.10.7",
    "numpy==2.3.4",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "requests==2.32.5",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "statsmodels==0.14.5",
]

[tool.uv]
package = false
# Indirect dependencies pinned to the versions the published results were produced with.
constraint-dependencies = [
    "certifi==2025.10.5",
    "charset-normalizer==3.4.4",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.60.1",
    "idna==3.11",
    "markupsafe==3.0.3",
    "kiwisolver==1.4.9",
    "packaging==25.0",
    "patsy==1.0.2",
    "pillow==12.0.0",
    "pyparsing==3.2.5",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "six==1.17.0",
    "tzdata==2025.2",
    "urllib3==2.5.0",
    "et-xmlfile==2.0.0",
    "colorama==0.4.6",
]
